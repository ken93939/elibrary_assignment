spring.application.name=elibrary
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/elibrary}
spring.datasource.username=${DATABASE_USERNAME:elibrary}
spring.datasource.password=${DATABASE_PASSWORD:elibrary}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.flyway.locations=classpath:db/migration
spring.jackson.deserialization.fail-on-unknown-properties=true
elibrary.storage.s3.region=${AWS_REGION:us-east-1}
elibrary.storage.s3.bucket=${S3_BUCKET:elibrary-content}
elibrary.storage.s3.endpoint=${S3_ENDPOINT:}
elibrary.storage.s3.path-style-access=${S3_PATH_STYLE_ACCESS:false}
