plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
	id 'checkstyle'
}

group = 'com.kenkwok.mirae'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	s3MockRuntime {
		canBeConsumed = false
		transitive = false
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation platform('software.amazon.awssdk:bom:2.57.8')
	implementation 'software.amazon.awssdk:s3'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'io.zonky.test:embedded-postgres:2.2.2'
	testImplementation 'software.amazon.awssdk:url-connection-client'
	s3MockRuntime 'com.adobe.testing:s3mock:5.2.3:exec@jar'
	testImplementation platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.8.0')
	testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-darwin-arm64v8'
	testRuntimeOnly 'io.zonky.test.postgres:embedded-postgres-binaries-linux-arm64v8'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	doFirst {
		systemProperty 's3mock.jar', configurations.s3MockRuntime.singleFile.absolutePath
	}
}

tasks.named('bootTestRun') {
	doFirst {
		systemProperty 's3mock.jar', configurations.s3MockRuntime.singleFile.absolutePath
	}
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.30.0')
		removeUnusedImports()
	}
}

checkstyle {
	toolVersion = '14.4.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	configProperties = [methodNameFormat: '^[a-z][a-zA-Z0-9]*$']
	maxWarnings = 0
}

tasks.named('checkstyleTest') {
	configProperties = [methodNameFormat: '^([a-z][a-zA-Z0-9]*|given[A-Z][a-zA-Z0-9]*_when[A-Z][a-zA-Z0-9]*_then[A-Z][a-zA-Z0-9]*)$']
}

tasks.named('check') {
	dependsOn tasks.named('spotlessCheck')
}
